<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; line-height: 1.6; color: #333;">
    <h2 style="color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 10px;">New Book Order Request</h2>
    <table style="width: 100%; border-collapse: collapse;">
        <tr><td style="padding: 8px; border-bottom: 1px solid #eee;"><strong>Full Name:</strong></td><td>{{ full_name }}</td></tr>
        <tr><td style="padding: 8px; border-bottom: 1px solid #eee;"><strong>Phone:</strong></td><td>{{ phone }}</td></tr>
        <tr><td style="padding: 8px; border-bottom: 1px solid #eee;"><strong>Email:</strong></td><td>{{ email|default:"Not provided" }}</td></tr>
        <tr><td style="padding: 8px; border-bottom: 1px solid #eee;"><strong>City/District:</strong></td><td>{{ city }}</td></tr>
        <tr><td style="padding: 8px; border-bottom: 1px solid #eee;"><strong>Address:</strong></td><td>{{ address }}</td></tr>
        <tr><td style="padding: 8px; border-bottom: 1px solid #eee;"><strong>Quantity:</strong></td><td>{{ quantity }}</td></tr>
    </table>
    <div style="margin-top: 20px; padding: 15px; background: #f9f9f9; border-left: 4px solid #007bff;">
        <strong>Additional Notes:</strong><br>
        {{ notes|default:"N/A"|linebreaks }}
    </div>
    <p style="font-size: 12px; color: #777; margin-top: 30px;">This order was placed via acetheentrance.com</p>
</body>
</html>
